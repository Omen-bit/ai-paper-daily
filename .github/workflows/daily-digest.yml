name: Daily edition

# Every morning: fetch and pick the papers, write their notes, sync the database,
# then build the website and publish it to GitHub Pages.
#
# The main start is a workflow_dispatch sent at 01:30 UTC (07:00 IST) by an
# outside scheduler (cron-job.org), because GitHub starts dispatched runs at once
# but often runs its own schedule an hour or more late. The schedule below is
# only a backup: it does nothing if today's edition already exists.
on:
  schedule:
    - cron: "30 2 * * *" # backup, 08:00 IST
  workflow_dispatch:

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    name: Build today's edition
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Kolkata"
    permissions:
      contents: write # commit data/
      pages: write # publish the website
      id-token: write # required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Skip the backup run if today's edition is out
        id: check
        run: |
          today=$(date +'%Y-%m-%d')
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/daily/$today.json" ]; then
            echo "Today's edition ($today) was already published by the on-time run. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - if: steps.check.outputs.skip != 'true'
        name: Install dependencies
        run: pip install -r requirements.txt

      - if: steps.check.outputs.skip != 'true'
        name: Pick today's papers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
        run: python src/main.py

      - if: steps.check.outputs.skip != 'true'
        name: Sync to Supabase
        continue-on-error: true # the site still builds if Supabase is down
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: python src/supabase_sync.py

      - if: steps.check.outputs.skip != 'true'
        name: Build the website
        env:
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables)
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BUTTONDOWN_USER: ${{ vars.BUTTONDOWN_USER }}
        run: python src/site_builder.py

      - if: steps.check.outputs.skip != 'true'
        name: Commit the day's data
        run: |
          git config user.name "Omen-bit"
          git config user.email "darshanchougule821@gmail.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new data today."
            exit 0
          fi
          git commit -m "data: edition for $(date +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            echo "Push failed, retrying ($attempt/3)..."
            sleep 5
          done
          exit 1

      - if: steps.check.outputs.skip != 'true'
        name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - if: steps.check.outputs.skip != 'true'
        name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
