name: 🧠 Daily AI Paper Digest

on:
  schedule:
    # Runs every day at 18:30 UTC (00:00 IST / midnight)
    # arXiv submissions are usually available by this time
    - cron: "30 18 * * *"

  # Allows manual trigger from the GitHub Actions UI anytime
  workflow_dispatch:

jobs:
  generate-digest:
    name: Fetch, Classify & Commit Daily Digest
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to push commits

    steps:
      # -- 1. Checkout the repository --------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for accurate git log

      # -- 2. Set up Python -------------------------------------------------
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -- 3. Install dependencies ------------------------------------------
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -- 4. Run the main pipeline -----------------------------------------
      - name: 🚀 Run AI Paper Daily pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/main.py

      # -- 5. Commit & push all changes --------------------------------------
      - name: 📤 Commit and push changes
        run: |
          git config --global user.name "Omen-bit"
          git config --global user.email "darshanchougule821@gmail.com"

          git add -A

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit today."
          else
            DATE=$(date -u +'%Y-%m-%d')
            git commit -m "📄 Daily digest: ${DATE} - AI Paper Daily"

            # Securely rebase on latest upstream to prevent race conditions
            MAX_RETRIES=3
            COUNT=0
            until git push origin main; do
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge $MAX_RETRIES ]; then
                echo "❌ Push failed after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "⚠️ Upstream changes detected. Pulling with rebase and retrying ($COUNT/$MAX_RETRIES)..."
              git pull --rebase origin main
              sleep 2
            done
            echo "✅ Changes pushed successfully."
          fi
