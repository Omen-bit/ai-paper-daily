name: Daily edition

# Every morning: fetch and pick the papers, write their notes, sync the database,
# then build the website and publish it to GitHub Pages.
on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 07:00 IST, after arXiv's daily release
  workflow_dispatch:

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    name: Build today's edition
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Kolkata"
    permissions:
      contents: write # commit data/
      pages: write # publish the website
      id-token: write # required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick today's papers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
        run: python src/main.py

      - name: Sync to Supabase
        continue-on-error: true # the site still builds if Supabase is down
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: python src/supabase_sync.py

      - name: Build the website
        run: python src/site_builder.py

      - name: Commit the day's data
        run: |
          git config user.name "Omen-bit"
          git config user.email "darshanchougule821@gmail.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new data today."
            exit 0
          fi
          git commit -m "data: edition for $(date +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            echo "Push failed, retrying ($attempt/3)..."
            sleep 5
          done
          exit 1

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
