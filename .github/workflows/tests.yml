name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  functions:
    name: Supabase functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The same pinned versions as supabase/functions/_shared/langgraph.ts, for the Scout graph tests
      - run: npm install --no-save --no-package-lock @langchain/langgraph@1.5.1 @langchain/langgraph-sdk@1.12.5 @langchain/langgraph-checkpoint@1.2.0 @langchain/core@1.3.0 zod@4.6.7
      - run: node --experimental-strip-types --test supabase/tests/*.test.ts
